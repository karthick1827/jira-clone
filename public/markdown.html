    <script>window.__ACL_EMBEDDED_FILES__ = [{"id":"_acl-output_1-analysis_acl-product-brief_brief_md","folderPath":"_acl-output/1-analysis/acl-product-brief","filename":"brief.md","status":"Approved","updatedAt":"2026-09-09T18:38:32.095Z","content":"﻿---\ntitle: \"Product Brief: Assignee Filter Option\"\nproject_type: brownfield\ntier: Tier 2 (Major Overhaul)\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-09T18:35:00.000Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ncreated: 2026-09-09\nupdated: 2026-09-09\n---\n\n# 🎯 Product Brief: Assignee Filter Option\n## Project: Jira Sprint Board (Brownfield Tier 2)\n\n---\n\n## 1. Executive Summary & Problem Statement\n\nIn the existing Jira Clone application, sprint board cards can be searched via text and filtered by priority (High, Medium, Low). However, as teams scale and boards fill with issues across multiple columns, developers and sprint leads struggle to quickly isolate tasks assigned to a specific engineer or view unassigned items needing triage.\n\nThe **Assignee Filter Option** introduces a dedicated assignee dropdown filter to the board query toolbar. This enables one-click filtering by team member (e.g., \"Karthick N\", \"Sarah L\") or \"Unassigned\", composing seamlessly with existing keyword search and priority filtering while persisting user filter preferences across sessions.\n\n---\n\n## 2. Strategic Value & Alignment\n\n- **Daily Standup Acceleration:** Individual engineers can isolate their active work items in a single click, eliminating visual noise during standup updates.\n- **Unassigned Backlog Triage:** Sprint masters can immediately filter for unassigned cards to assign ownership during planning and grooming sessions.\n- **Composability:** Integrates into the existing Zustand state store (`useJiraStore`) and board layout without altering the core Kanban drag-and-drop mechanics.\n\n---\n\n## 3. Scope & Blast Radius (Tier 2 Assessment)\n\n- **In Scope:**\n  - Dynamic extraction of unique assignees from the active issue collection.\n  - Dropdown UI component placed beside the Priority filter and Search input.\n  - Integration with the board's compound issue-filtering logic.\n  - Local persistence via Zustand storage key.\n- **Out of Scope:**\n  - Modifying the underlying issue data structure or backend sync API.\n  - Multi-select assignee filtering (single-select is sufficient for V1).\n\n---\n\n## 4. Upstream / Downstream Traceability\n\n- **Upstream Context:** Built against established patterns documented in `_acl-output/project-context.md`.\n- **Downstream Deliverables:** Feeds directly into `Phase 2: PRD` (`_acl-output/2-plan-workflows/acl-prd/prd.md`), `Phase 3A: Architecture Spine`, and `Phase 3B: Epics`.\r\n"},{"id":"_acl-output_2-plan-workflows_acl-prd_prd_md","folderPath":"_acl-output/2-plan-workflows/acl-prd","filename":"prd.md","status":"Approved","updatedAt":"2026-09-09T18:36:04.153Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-09T18:36:04.142Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: Assignee Filter Option PRD\ncreated: 2026-09-09\nupdated: 2026-09-09\n---\n\n# 📋 Product Requirements Document (PRD)\n## Feature: Assignee Filter Option (Jira Sprint Board)\n\n---\n\n## 0. Document Purpose\n\nThis document defines the functional, technical, and operational requirements for the **Assignee Filter Option** feature on the Jira Clone Sprint Board. This PRD acts as the official contract between Product Management, Engineering, and QA for Phase 2 under ACL-ADLC sequential delivery protocol. It informs the downstream **Phase 3A Architecture Spine** and **Phase 3B Epics & Stories Breakdown**.\n\n---\n\n## 1. Product Vision & Executive Summary\n\nThe **Assignee Filter Option** empowers team members, engineering leads, and scrum masters to filter board tasks by individual team members or unassigned work items in a single click. As teams scale their sprint boards with dozens of issues across Backlog, To Do, In Progress, In Review, and Done, finding tickets assigned to a specific engineer becomes tedious. \n\nAdding an assignee filter dropdown alongside the existing Search query bar and Priority filter dropdown establishes a comprehensive, multi-dimensional query toolbar, dramatically improving sprint standup efficiency, personal workflow isolation, and individual task tracking.\n\n### Core Objectives\n1. **Targeted Task Focus:** Allow developers to isolate their personal tasks (e.g. \"Karthick N\") with zero noise during daily standups.\n2. **Unassigned Issue Triage:** Enable sprint leads to quickly isolate \"Unassigned\" issues for immediate sprint grooming and assignment.\n3. **Multi-Filter Composability:** Seamlessly compose Assignee filtering with existing text search (by title/key) and Priority filtering (High/Medium/Low).\n4. **Persistent State Experience:** Maintain selected assignee filter preferences across sessions and page refreshes via the established Zustand storage synchronizer.\n\n---\n\n## 2. Target User & Key User Journeys\n\n### 2.1 Target Personas\n- **Sprint Developer (Primary):** Wants to view only their assigned cards across all board columns to update progress and transition statuses during daily standup.\n- **Scrum Master / Lead (Secondary):** Wants to inspect individual member workload distributions, verify balanced assignments, or identify unassigned tickets requiring triage.\n\n### 2.2 User Journeys\n\n- **UJ-1: Engineer Filters for Personal Tickets During Standup**\n  - **Persona & Context:** Karthick (Senior Frontend Engineer) joins the daily 15-minute standup call.\n  - **Entry State:** Board displays 30+ mixed issues across all 5 columns. Search bar is empty, Priority filter is set to \"All Priorities\".\n  - **Path:**\n    1. Karthick clicks the \"Assignee\" filter dropdown in the header controls row.\n    2. He selects \"Karthick N\".\n    3. The board immediately filters issues across all columns to display only cards assigned to \"Karthick N\".\n    4. The header status statistics chips update or reflect the focused view.\n  - **Climax:** Karthick easily talks through his in-progress and in-review tickets without visual clutter.\n  - **Resolution:** Karthick concludes his update and resets the filter to return to full board view.\n\n- **UJ-2: Lead Identifies Unassigned Backlog Items**\n  - **Persona & Context:** Sarah (Engineering Manager / Scrum Lead) conducts sprint grooming.\n  - **Entry State:** Board has several issues in Backlog and To Do.\n  - **Path:**\n    1. Sarah opens the \"Assignee\" dropdown and selects \"Unassigned\".\n    2. The board isolates all tickets currently without an owner (`assignee: 'Unassigned'`).\n    3. Sarah clicks on an unassigned ticket, opens the modal, and assigns it to Alex Rivera.\n  - **Climax:** The reassigned ticket dynamically drops out of the \"Unassigned\" view in real-time.\n  - **Resolution:** All tickets in the sprint are cleanly owned.\n\n- **UJ-3: Multi-Criteria Filter Intersection & Reset**\n  - **Persona & Context:** Alex (Frontend Dev) searching for high-priority bugs assigned to Elena.\n  - **Entry State:** Board view is active.\n  - **Path:**\n    1. Alex sets Priority filter to \"High Priority\".\n    2. Alex sets Assignee filter to \"Elena Rostova\".\n    3. Board calculates intersection: `priority === 'high' && assignee === 'Elena Rostova'`.\n    4. If no tickets match, the board renders the empty search state with a \"Reset Search & Filters\" button.\n    5. Alex clicks \"Reset Search & Filters\", which resets Assignee to \"All Assignees\", Priority to \"All Priorities\", and Search to `\"\"`.\n  - **Climax:** Smooth recovery from zero-result intersections.\n\n---\n\n## 3. Domain Glossary\n\n- **Assignee:** The team member string associated with an issue (e.g., `'Karthick N'`, `'Sarah Connor'`, `'Unassigned'`).\n- **Assignee Filter (`assigneeFilter`):** Global store state string representing current filter selection: `'all' | string`.\n- **Composite Filtering:** The logical AND evaluation: `matchesSearch && matchesPriority && matchesAssignee`.\n- **Dynamic Assignee Extraction:** Deriving unique assignee names programmatically from the current `issues` collection, deduplicating, sorting alphabetically, and ensuring `'Unassigned'` is handled cleanly.\n\n---\n\n## 4. Functional Requirements\n\n### FR-1: Assignee Filter State in Zustand Store\n- **FR-1.1:** Extend `JiraState` with `assigneeFilter: string` initialized to `'all'`.\n- **FR-1.2:** Add action `setAssigneeFilter: (assignee: string) => void` updating state immutably.\n- **FR-1.3:** Include `assigneeFilter` in Zustand `persist` whitelist/partialize array so selection persists across browser reloads.\n\n### FR-2: Dynamic Assignee Options Extraction\n- **FR-2.1:** The UI must extract unique assignees dynamically from `issues` in `useJiraStore`.\n- **FR-2.2:** The dropdown options must always include:\n  1. `\"All Assignees\"` (value: `'all'`) as the default first option.\n  2. Alphabetically sorted unique assignee names present in the system.\n  3. `\"Unassigned\"` (if unassigned issues exist) positioned at the bottom or logically sorted.\n- **FR-2.3:** If an assignee is deleted or renamed while selected, the store must gracefully fall back to `'all'`.\n\n### FR-3: Header Controls Row UI Integration\n- **FR-3.1:** Place the Assignee Filter control adjacent to the Priority Filter inside `.search-filter-wrapper` in `src/components/Header.tsx`.\n- **FR-3.2:** Maintain consistent layout styling:\n  - Icon: Lucide `User` or `Users` icon (`size={15}`).\n  - Label: `<span class=\"filter-label\">Assignee:</span>`.\n  - Dropdown: `<select className=\"assignee-select\">` mirroring `.priority-select` styles.\n- **FR-3.3:** Maintain responsive wrapping across desktop and tablet screen widths without breaking the `.header-stats-chips` layout.\n\n### FR-4: Board View Filtering & Empty State Integration\n- **FR-4.1:** Update `filteredIssues` `useMemo` in `src/components/BoardView.tsx` to evaluate:\n  ```typescript\n  const matchesAssignee = assigneeFilter === 'all' || issue.assignee === assigneeFilter;\n  return matchesSearch && matchesPriority && matchesAssignee;\n  ```\n- **FR-4.2:** Update `hasActiveFilters` in `BoardView.tsx`:\n  ```typescript\n  const hasActiveFilters = searchQuery !== '' || priorityFilter !== 'all' || assigneeFilter !== 'all';\n  ```\n- **FR-4.3:** Update `resetFilters` function in `BoardView.tsx` to call `setAssigneeFilter('all')`.\n- **FR-4.4:** In the empty state message (`.no-search-results`), display the active assignee filter when active (e.g. `assigned to \"Sarah Connor\"`).\n\n---\n\n## 5. Non-Functional Requirements\n\n- **NFR-1 (Zero Mutation & Zustand Invariants):** Actions must strictly adhere to project invariants in `_acl-output/project-context.md`. Never mutate state directly.\n- **NFR-2 (Strict TypeScript Compliance):** `verbatimModuleSyntax` and `erasableSyntaxOnly` must be strictly respected. No TypeScript enums. Use `import type` for type-only imports.\n- **NFR-3 (Performance):** Filter calculations in `useMemo` must execute in `<16ms` (sub-frame) for up to 1,000 issues.\n- **NFR-4 (Styling Integrity):** Leverage existing CSS custom variables in `src/styles.css` without introducing external utility frameworks or conflicting inline overrides.\n- **NFR-5 (Test Verification):** Maintain 100% pass rate in Vitest unit and integration test suite (`npm test`).\n\n---\n\n## 6. Assumptions & Open Questions\n\n- `[ASSUMPTION]` **Dynamic vs Static Roster:** Dynamic extraction from active issues is preferred for Brownfield v1, as no centralized user/employee database table currently exists in `useJiraStore.ts`.\n- `[ASSUMPTION]` **Single-Select Dropdown:** A single-select `<select>` element aligns with the current Priority filter design language and avoids introducing heavyweight multi-select libraries.\n- `[ASSUMPTION]` **Reset Behavior:** \"Reset Search & Filters\" resets all three controls (searchQuery, priorityFilter, assigneeFilter) simultaneously.\n\n---\n\n## 7. Downstream Traceability\n\nUpon manager sign-off of this PRD in Markdown Studio:\n- **Phase 3A:** Technical architecture spine (`_acl-output/3-solutioning/acl-architecture/ARCHITECTURE-SPINE.md`) will define interface contracts, state migration strategy, and component hierarchy.\n- **Phase 3B:** Epics & Stories breakdown (`_acl-output/3-solutioning/acl-create-epics-and-stories/epics.md`) will break down the implementation tasks for store enhancement, header UI, and board filtering.\n"},{"id":"_acl-output_3-solutioning_acl-architecture_ARCHITECTURE-SPINE_md","folderPath":"_acl-output/3-solutioning/acl-architecture","filename":"ARCHITECTURE-SPINE.md","status":"Approved","updatedAt":"2026-09-09T18:37:44.526Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-09T18:37:44.505Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: Assignee Filter Architecture Spine\ncreated: 2026-09-09\nupdated: 2026-09-09\n---\n\n# 🏛️ Architecture Spine: Assignee Filter Option\n## System Solutioning & Invariant Contract (Phase 3A)\n\n---\n\n## 1. Context & Architectural Altitude\n\n- **System Context:** Jira Kanban Sprint Board (`jira-clone`), a React 19 + TypeScript + Zustand client application.\n- **Architectural Scope:** Integration of an Assignee Filter dimension into the existing global state store, header controls toolbar, and board filtering pipeline.\n- **Prerequisite Invariant:** Derives from the approved PRD (`_acl-output/2-plan-workflows/acl-prd/prd.md`) with zero regressions to existing board operations, card drag-and-drop, modals, or test suites.\n\n---\n\n## 2. Core Paradigm & Invariants\n\n```mermaid\nflowchart TD\n    subgraph UI [\"Presentation Layer (React 19)\"]\n        H[\"Header.tsx<br/>(Assignee Select Dropdown)\"]\n        BV[\"BoardView.tsx<br/>(Filtered Issues Memo)\"]\n        KC[\"KanbanColumn.tsx<br/>(Render Column Cards)\"]\n    end\n\n    subgraph State [\"Global State Layer (Zustand 5)\"]\n        JS[\"useJiraStore<br/>- assigneeFilter: string<br/>- setAssigneeFilter(assignee)\"]\n        PS[\"persist Middleware<br/>(localStorage sync)\"]\n    end\n\n    H -->|User Selects Assignee| JS\n    JS -->|Sync State| PS\n    JS -->|Reactive Subscription| BV\n    BV -->|Passes filtered issues| KC\n    BV -->|Reset Action| JS\n```\n\n### Architectural Decisions (ADs)\n\n#### AD-01: State Slicing in `useJiraStore` [ADOPTED]\n- **Binds:** `src/store/useJiraStore.ts`\n- **Prevents:** State synchronization fragmentation across disparate React local states.\n- **Rule:** \n  - Add `assigneeFilter: string` to `JiraState` with initial default value `'all'`.\n  - Add `setAssigneeFilter: (assignee: string) => void` to actions.\n  - State updates MUST be immutable (return new object reference without mutating previous state).\n  - Include `assigneeFilter` in the `persist` middleware storage configuration so user filter preferences persist across page reloads.\n\n#### AD-02: Dynamic Assignee Extraction & Normalization [ADOPTED]\n- **Binds:** `src/components/Header.tsx`\n- **Prevents:** Hardcoded team member lists diverging from issues created/edited in the board.\n- **Rule:**\n  - Extract unique assignees dynamically from the store's `issues` collection:\n    ```typescript\n    const uniqueAssignees = useMemo(() => {\n      const names = new Set(issues.map((i) => i.assignee).filter(Boolean));\n      return Array.from(names).sort((a, b) => a.localeCompare(b));\n    }, [issues]);\n    ```\n  - The dropdown renders:\n    1. `<option value=\"all\">All Assignees</option>` (default).\n    2. Dynamic assignee names mapped alphabetically.\n  - If the active `assigneeFilter` is not in the extracted list and not `'all'`, gracefully fallback to `'all'`.\n\n#### AD-03: Composite Multi-Filter Evaluation [ADOPTED]\n- **Binds:** `src/components/BoardView.tsx`\n- **Prevents:** Inconsistent or conflicting filter predicates between search, priority, and assignee.\n- **Rule:**\n  - All filter criteria are composed using strict logical AND:\n    ```typescript\n    const filteredIssues = useMemo(() => {\n      return issues.filter((issue) => {\n        const matchesSearch =\n          searchQuery.trim() === '' ||\n          issue.title.toLowerCase().includes(searchQuery.toLowerCase()) ||\n          issue.id.toLowerCase().includes(searchQuery.toLowerCase()) ||\n          issue.assignee.toLowerCase().includes(searchQuery.toLowerCase());\n\n        const matchesPriority =\n          priorityFilter === 'all' || issue.priority === priorityFilter;\n\n        const matchesAssignee =\n          assigneeFilter === 'all' || issue.assignee === assigneeFilter;\n\n        return matchesSearch && matchesPriority && matchesAssignee;\n      });\n    }, [issues, searchQuery, priorityFilter, assigneeFilter]);\n    ```\n\n#### AD-04: Composite Filter State Invalidation & Reset [ADOPTED]\n- **Binds:** `src/components/BoardView.tsx`\n- **Prevents:** Stale empty states and orphaned active filter conditions.\n- **Rule:**\n  - Active filter detector:\n    ```typescript\n    const hasActiveFilters = searchQuery !== '' || priorityFilter !== 'all' || assigneeFilter !== 'all';\n    ```\n  - The `resetFilters` handler MUST atomically reset all filter vectors:\n    ```typescript\n    const resetFilters = () => {\n      setSearchQuery('');\n      setPriorityFilter('all');\n      setAssigneeFilter('all');\n    };\n    ```\n\n#### AD-05: Strict TypeScript & CSS System Invariants [ADOPTED]\n- **Binds:** Global codebase (`src/styles.css`, `src/types/jira.ts`)\n- **Prevents:** Build failures and style regression against `project-context.md`.\n- **Rule:**\n  - No TypeScript Enums. Use string union or string primitive.\n  - Types imported using `import type { ... }` (`verbatimModuleSyntax`).\n  - Use native CSS custom properties in `.assignee-filter-container` matching `.priority-filter-container`:\n    - `var(--border-color)`\n    - `var(--bg-canvas)`\n    - `var(--text-primary)`\n    - `var(--radius-md)`\n  - No external styling packages or Tailwind classes introduced.\n\n---\n\n## 3. Component Contract & Interface Delta\n\n```typescript\n// Interface delta in src/store/useJiraStore.ts\nexport interface JiraState {\n  // Existing state...\n  issues: Issue[];\n  searchQuery: string;\n  priorityFilter: Priority | 'all';\n  assigneeFilter: string; // <-- NEW\n  selectedIssue: Issue | null;\n  isModalOpen: boolean;\n  modalInitialStatus: IssueStatus;\n\n  // Existing actions...\n  setSearchQuery: (query: string) => void;\n  setPriorityFilter: (priority: Priority | 'all') => void;\n  setAssigneeFilter: (assignee: string) => void; // <-- NEW\n  // ...\n}\n```\n\n---\n\n## 4. Verification & Testing Strategy\n\n1. **Store Unit Tests (`src/store/__tests__/useJiraStore.test.ts`):**\n   - Verify initial `assigneeFilter` is `'all'`.\n   - Verify `setAssigneeFilter` updates filter value immutably.\n   - Verify filter resets cleanly with `resetFilters`.\n2. **Component Integration Tests (`src/components/__tests__/BoardFiltering.test.tsx`):**\n   - Verify rendering of Assignee dropdown with dynamic options.\n   - Verify selecting an assignee hides non-matching cards across columns.\n   - Verify multi-filter composition (Assignee + Priority).\n   - Verify empty state message displays active assignee and reset button works.\n3. **Regression Suite:**\n   - Execute `npm test` and `npm run lint` with 100% pass guarantee.\n"},{"id":"_acl-output_3-solutioning_acl-create-epics-and-stories_epics_md","folderPath":"_acl-output/3-solutioning/acl-create-epics-and-stories","filename":"epics.md","status":"Approved","updatedAt":"2026-09-10T04:35:44.243Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-09T18:39:43.033Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: Assignee Filter Epics & Stories Breakdown\ncreated: 2026-09-09\nupdated: 2026-09-09\n---\n\n# 📋 Epics & User Stories Breakdown: Assignee Filter Option\n## Implementation Backlog (Phase 3B)\n\n---\n\n## Overview\n\nThis backlog outlines the epics and granular user stories required to implement the **Assignee Filter Option** on the Jira Kanban board. It adheres strictly to the approved **PRD** (`_acl-output/2-plan-workflows/acl-prd/prd.md`) and **Architecture Spine** (`_acl-output/3-solutioning/acl-architecture/ARCHITECTURE-SPINE.md`).\n\n---\n\n## Epic 1: Global State & Filter Store Enhancement\n\n### Story 1.1: Extend Zustand Store with Assignee State & Action\n- **Description:** Update `src/store/useJiraStore.ts` to support global `assigneeFilter` state, defaulting to `'all'`, with immutable setter actions and localStorage persistence.\n- **Acceptance Criteria:**\n  - [x] Add `assigneeFilter: string` to `JiraState` interface initialized to `'all'`.\n  - [x] Add `setAssigneeFilter: (assignee: string) => void` action that returns a new state object immutably.\n  - [x] Include `assigneeFilter` in the `persist` middleware storage configuration so preferences persist across browser reloads.\n  - [x] Ensure strict TypeScript compliance under `verbatimModuleSyntax` and `erasableSyntaxOnly`.\n\n### Story 1.2: Store Unit Tests for Assignee Filter\n- **Description:** Implement unit tests in `src/store/__tests__/useJiraStore.test.ts` to test state transitions and immutability.\n- **Acceptance Criteria:**\n  - [x] Test verifying default `assigneeFilter` is `'all'`.\n  - [x] Test verifying calling `setAssigneeFilter('Sarah Connor')` updates state cleanly.\n  - [x] Test verifying updating `assigneeFilter` does not mutate issues or other store properties.\n\n---\n\n## Epic 2: Header Filter Controls & Responsive Styling\n\n### Story 2.1: Assignee Filter UI Component in Header\n- **Description:** Integrate the Assignee Filter selector into `src/components/Header.tsx` inside the `.search-filter-wrapper`.\n- **Acceptance Criteria:**\n  - [x] Dynamically compute `uniqueAssignees` from `issues` using `useMemo`, sorting alphabetically.\n  - [x] Render a `.assignee-filter-container` with Lucide `User` icon (`size={15}`) and `<span className=\"filter-label\">Assignee:</span>`.\n  - [x] Render `<select className=\"assignee-select\">` bound to `assigneeFilter` and `setAssigneeFilter`.\n  - [x] Include `<option value=\"all\">All Assignees</option>` as the first option followed by mapped assignees.\n\n### Story 2.2: CSS Custom Properties & Responsive Layout\n- **Description:** Add CSS rules in `src/styles.css` for `.assignee-filter-container` and `.assignee-select`.\n- **Acceptance Criteria:**\n  - [x] Match existing design tokens from `.priority-filter-container` and `.priority-select`.\n  - [x] Maintain responsive flex-wrapping on narrow and tablet viewports without clipping `.header-stats-chips`.\n  - [x] Avoid introducing external CSS libraries or modifying global design variables.\n\n---\n\n## Epic 3: Board View Filtering & Empty State Integration\n\n### Story 3.1: Composite Filtering in Board View\n- **Description:** Update the filtering pipeline in `src/components/BoardView.tsx` to include `assigneeFilter`.\n- **Acceptance Criteria:**\n  - [x] Update `filteredIssues` `useMemo` dependency array to include `assigneeFilter`.\n  - [x] Evaluate composite filter condition: `matchesSearch && matchesPriority && matchesAssignee`.\n  - [x] Ensure issues without an assignee or assigned to \"Unassigned\" are filterable via `'Unassigned'`.\n\n### Story 3.2: Empty Results State & Filter Reset\n- **Description:** Enhance empty state feedback and reset functionality in `src/components/BoardView.tsx`.\n- **Acceptance Criteria:**\n  - [x] Update `hasActiveFilters` to evaluate `searchQuery !== '' || priorityFilter !== 'all' || assigneeFilter !== 'all'`.\n  - [x] Update `resetFilters` handler to call `setAssigneeFilter('all')`, resetting all filters atomically.\n  - [x] In the empty state message (`.no-search-results`), display the active assignee filter when active.\n\n### Story 3.3: Integration Testing & Verification\n- **Description:** Validate full board filtering behavior and run end-to-end test assertions.\n- **Acceptance Criteria:**\n  - [x] Verify that selecting an assignee filters cards correctly across Backlog, To Do, In Progress, In Review, and Done columns.\n  - [x] Verify that composite filters (Search + Priority + Assignee) compute the intersection accurately.\n  - [x] Ensure all existing tests in `src/components/__tests__/` continue to pass with `npm test`.\n  - [x] Run `npm run lint` with 0 errors.\n"},{"id":"_acl-output_4-implementation_story-1-1_md","folderPath":"_acl-output/4-implementation","filename":"story-1-1.md","status":"Approved","updatedAt":"2026-09-10T04:30:52.855Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-09T19:03:55.368Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 1.1: Extend Zustand Store with Assignee State & Action\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"1.1\"\nepic_id: \"1\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 1.1: Extend Zustand Store with Assignee State & Action\n\n## Overview & Scope\nUpdate the global store in `src/store/useJiraStore.ts` to introduce global `assigneeFilter` state, defaulting to `'all'`, with an immutable setter action and localStorage persistence.\n\n## Technical Contract\n- **State Interface**:\n  - Add `assigneeFilter: string` property to `JiraState` interface.\n  - Default value: `'all'`.\n- **Actions**:\n  - Add `setAssigneeFilter: (assignee: string) => void` action.\n  - State transition must update `assigneeFilter` immutably without altering `issues`, `columns`, or other store slices.\n- **Persistence Middleware**:\n  - Ensure `assigneeFilter` is included in the `persist` middleware whitelist/storage config.\n- **Compiler Compatibility**:\n  - Strict TypeScript compliance under `verbatimModuleSyntax` and `erasableSyntaxOnly`.\n\n## Acceptance Criteria\n- [x] Add `assigneeFilter: string` to `JiraState` interface initialized to `'all'`.\n- [x] Add `setAssigneeFilter: (assignee: string) => void` action that returns a new state object immutably.\n- [x] Include `assigneeFilter` in the `persist` middleware storage configuration so preferences persist across browser reloads.\n- [x] Ensure strict TypeScript compliance under `verbatimModuleSyntax` and `erasableSyntaxOnly`.\n"},{"id":"_acl-output_4-implementation_story-1-2_md","folderPath":"_acl-output/4-implementation","filename":"story-1-2.md","status":"In Review","updatedAt":"2026-09-10T04:36:26.760Z","content":"---\nstatus: In Review\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-10T04:36:26.743Z\ngate_signature: ACL-STUDIO-APPROVAL-IN-REVIEW\ntitle: \"Story 1.2: Store Unit Tests for Assignee Filter\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"1.2\"\nepic_id: \"1\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 1.2: Store Unit Tests for Assignee Filter\n\n## Overview & Scope\nImplement unit tests in `src/store/__tests__/useJiraStore.test.ts` to verify state transitions and immutability for the newly added `assigneeFilter` store property and `setAssigneeFilter` action.\n\n## Technical Contract\n- **Test File**: `src/store/__tests__/useJiraStore.test.ts`\n- **Assertions**:\n  - Verify that the initial `assigneeFilter` state evaluates to `'all'`.\n  - Verify that invoking `useJiraStore.getState().setAssigneeFilter('Sarah Connor')` updates `assigneeFilter` to `'Sarah Connor'`.\n  - Verify that invoking `setAssigneeFilter` preserves the existing `issues` list, `searchQuery`, `priorityFilter`, and other store properties without mutations.\n- **Test Framework**: Vitest.\n\n## Acceptance Criteria\n- [x] Test verifying default `assigneeFilter` is `'all'`.\n- [x] Test verifying calling `setAssigneeFilter('Sarah Connor')` updates state cleanly.\n- [x] Test verifying updating `assigneeFilter` does not mutate issues or other store properties.\n"},{"id":"_acl-output_4-implementation_story-2-1_md","folderPath":"_acl-output/4-implementation","filename":"story-2-1.md","status":"In Review","updatedAt":"2026-09-10T04:36:30.740Z","content":"---\nstatus: In Review\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-10T04:36:30.730Z\ngate_signature: ACL-STUDIO-APPROVAL-IN-REVIEW\ntitle: \"Story 2.1: Assignee Filter UI Component in Header\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"2.1\"\nepic_id: \"2\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 2.1: Assignee Filter UI Component in Header\n\n## Overview & Scope\nIntegrate the Assignee Filter selector dropdown into `src/components/Header.tsx` inside the `.search-filter-wrapper`, allowing users to select an assignee to filter the board.\n\n## Technical Contract\n- **Component File**: `src/components/Header.tsx`\n- **Dynamic Options**:\n  - Compute `uniqueAssignees` using `useMemo` from `issues` in `useJiraStore`, sorted alphabetically.\n- **UI Elements**:\n  - Render `.assignee-filter-container` containing:\n    - Lucide `User` icon (`size={15}`).\n    - `<span className=\"filter-label\">Assignee:</span>`.\n    - `<select className=\"assignee-select\">` bound to `assigneeFilter` value and `setAssigneeFilter` change handler.\n    - First option: `<option value=\"all\">All Assignees</option>`.\n    - Followed by mapped `<option>` items for each unique assignee.\n\n## Acceptance Criteria\n- [x] Dynamically compute `uniqueAssignees` from `issues` using `useMemo`, sorting alphabetically.\n- [x] Render a `.assignee-filter-container` with Lucide `User` icon (`size={15}`) and `<span className=\"filter-label\">Assignee:</span>`.\n- [x] Render `<select className=\"assignee-select\">` bound to `assigneeFilter` and `setAssigneeFilter`.\n- [x] Include `<option value=\"all\">All Assignees</option>` as the first option followed by mapped assignees.\n"},{"id":"_acl-output_4-implementation_story-2-2_md","folderPath":"_acl-output/4-implementation","filename":"story-2-2.md","status":"In Review","updatedAt":"2026-09-10T04:36:35.657Z","content":"---\nstatus: In Review\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-10T04:36:35.636Z\ngate_signature: ACL-STUDIO-APPROVAL-IN-REVIEW\ntitle: \"Story 2.2: CSS Custom Properties & Responsive Layout\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"2.2\"\nepic_id: \"2\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 2.2: CSS Custom Properties & Responsive Layout\n\n## Overview & Scope\nAdd responsive CSS styling in `src/styles.css` for `.assignee-filter-container` and `.assignee-select`, matching existing design tokens from priority filter controls and maintaining flex-wrapping without viewport clipping.\n\n## Technical Contract\n- **Styles File**: `src/styles.css`\n- **Design Tokens**:\n  - Border radius, border colors, background colors, and typography matching `.priority-filter-container` and `.priority-select`.\n- **Responsive Layout**:\n  - Maintain flex layout with flex-wrap on narrow and tablet viewports, ensuring `.header-stats-chips` and filters wrap cleanly without layout shifts or horizontal clipping.\n- **Constraints**:\n  - Zero external CSS dependencies, preserve existing design system variables.\n\n## Acceptance Criteria\n- [x] Match existing design tokens from `.priority-filter-container` and `.priority-select`.\n- [x] Maintain responsive flex-wrapping on narrow and tablet viewports without clipping `.header-stats-chips`.\n- [x] Avoid introducing external CSS libraries or modifying global design variables.\n"},{"id":"_acl-output_4-implementation_story-3-1_md","folderPath":"_acl-output/4-implementation","filename":"story-3-1.md","status":"Rejected","updatedAt":"2026-09-10T04:36:39.653Z","content":"---\nstatus: Rejected\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-10T04:36:39.639Z\ngate_signature: ACL-STUDIO-APPROVAL-REJECTED\ntitle: \"Story 3.1: Composite Filtering in Board View\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"3.1\"\nepic_id: \"3\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 3.1: Composite Filtering in Board View\n\n## Overview & Scope\nUpdate the issue filtering pipeline in `src/components/BoardView.tsx` to include `assigneeFilter`, performing multi-criteria filtering across search query, priority filter, and assignee filter.\n\n## Technical Contract\n- **Component File**: `src/components/BoardView.tsx`\n- **Filtering Logic**:\n  - `assigneeFilter` retrieved from `useJiraStore()`.\n  - Dependency array of `filteredIssues` `useMemo` includes `[issues, searchQuery, priorityFilter, assigneeFilter]`.\n  - Matching condition:\n    - If `assigneeFilter === 'all'`: matches all issues.\n    - If `assigneeFilter === 'Unassigned'`: matches issues with `!issue.assignee || issue.assignee === 'Unassigned'`.\n    - Otherwise: `issue.assignee === assigneeFilter`.\n  - Composite predicate: `matchesSearch && matchesPriority && matchesAssignee`.\n\n## Acceptance Criteria\n- [x] Update `filteredIssues` `useMemo` dependency array to include `assigneeFilter`.\n- [x] Evaluate composite filter condition: `matchesSearch && matchesPriority && matchesAssignee`.\n- [x] Ensure issues without an assignee or assigned to \"Unassigned\" are filterable via `'Unassigned'`.\n"},{"id":"_acl-output_4-implementation_story-3-2_md","folderPath":"_acl-output/4-implementation","filename":"story-3-2.md","status":"Approved","updatedAt":"2026-09-10T04:33:41.838Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-10T04:33:30.030Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 3.2: Empty Results State & Filter Reset\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"3.2\"\nepic_id: \"3\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 3.2: Empty Results State & Filter Reset\n\n## Overview & Scope\nEnhance empty state feedback and atomic filter reset functionality in `src/components/BoardView.tsx` when no issues match the composite filters including assignee filter.\n\n## Technical Contract\n- **Component File**: `src/components/BoardView.tsx`\n- **Active Filters Evaluation**:\n  - `hasActiveFilters`: `searchQuery !== '' || priorityFilter !== 'all' || assigneeFilter !== 'all'`.\n- **Reset Handler**:\n  - `resetFilters` function resets `searchQuery` to `''`, `priorityFilter` to `'all'`, and `assigneeFilter` to `'all'`.\n- **Empty State Display**:\n  - In `.no-search-results`, display the active assignee filter message: `{assigneeFilter !== 'all' && ' assigned to \"' + assigneeFilter + '\"'}`.\n\n## Acceptance Criteria\n- [x] Update `hasActiveFilters` to evaluate `searchQuery !== '' || priorityFilter !== 'all' || assigneeFilter !== 'all'`.\n- [x] Update `resetFilters` handler to call `setAssigneeFilter('all')`, resetting all filters atomically.\n- [x] In the empty state message (`.no-search-results`), display the active assignee filter when active.\n"},{"id":"_acl-output_4-implementation_story-3-3_md","folderPath":"_acl-output/4-implementation","filename":"story-3-3.md","status":"Approved","updatedAt":"2026-09-10T04:35:29.918Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-10T04:33:53.029Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 3.3: Integration Testing & Verification\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"3.3\"\nepic_id: \"3\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 3.3: Integration Testing & Verification\n\n## Overview & Scope\nValidate board integration filtering, component assertions, composite filter intersection (search + priority + assignee), and full regression test suite pass with clean linting.\n\n## Technical Contract\n- **Test Execution**: `npm test` across all unit/integration test suites in `src/`.\n- **Lint Check**: `npm run lint` with 0 warnings or errors.\n- **Validation**:\n  - Verify cards filter accurately across Backlog, To Do, In Progress, In Review, and Done columns when an assignee is selected.\n  - Verify composite filter computes logical intersection (`AND`).\n  - Verify zero regressions across existing board and modal components.\n\n## Acceptance Criteria\n- [x] Verify that selecting an assignee filters cards correctly across Backlog, To Do, In Progress, In Review, and Done columns.\n- [x] Verify that composite filters (Search + Priority + Assignee) compute the intersection accurately.\n- [x] Ensure all existing tests in `src/components/__tests__/` continue to pass with `npm test`.\n- [x] Run `npm run lint` with 0 errors.\n"},{"id":"_acl-output_project-context_md","folderPath":"_acl-output","filename":"project-context.md","status":"Approved","updatedAt":"2026-09-09T18:10:05.941Z","content":"---\nproject_name: 'jira-clone'\nproject_type: brownfield\nuser_name: 'Karthick.natarajan'\ndate: '2026-09-09'\nsections_completed: ['technology_stack', 'language_rules', 'framework_rules', 'testing_rules', 'quality_rules', 'workflow_rules', 'anti_patterns']\nstatus: 'Accepted'\nrule_count: 27\noptimized_for_llm: true\n---\n\n# Project Context for AI Agents\n\n_This file contains critical rules and patterns that AI agents must follow when implementing code in this project. Focus on unobvious details that agents might otherwise miss._\n\n---\n\n## Technology Stack & Versions\n\n- **Framework & Runtime**: React 19.2.7, TypeScript 6.0.2 (targeting ES2023, bundler resolution)\n- **Build Tooling**: Vite 8.1.1 (@vitejs/plugin-react 6.0.3), Oxlint 1.71.0\n- **State Management**: Zustand 5.0.14 (`zustand/middleware` persist used for local storage synchronization)\n- **Iconography**: Lucide React 1.26.0\n- **Test Suite**: Vitest 5.0.0, JSDOM 29.1.1, @testing-library/react 16.3.3, @testing-library/jest-dom 7.0.1\n- **Compatibility Notes**:\n  - React 19 rules apply (use modern hooks; avoid deprecated legacy APIs).\n  - TypeScript strict erasable syntax & verbatim module syntax are enforced.\n\n## Critical Implementation Rules\n\n### Language-Specific Rules\n\n- **Strict Type-Only Imports (`verbatimModuleSyntax: true`)**:\n  - Always use `import type { ... } from '...'` when importing interfaces, type aliases, or type definitions.\n  - Never mix value and type imports in a single non-type import statement if the type is solely used for typing.\n- **Erasable Syntax Only (`erasableSyntaxOnly: true`)**:\n  - **No TypeScript Enums**: Use string literal union types instead (e.g., `export type Priority = 'low' | 'medium' | 'high'`).\n  - Do not use runtime TypeScript constructs such as namespaces or parameter properties in class constructors.\n- **Zero Unused Symbols**:\n  - `noUnusedLocals` and `noUnusedParameters` are enabled. Unused variables, imports, or parameters will cause build failures during `tsc -b`. Prefix intentional unused handler parameters with `_`.\n- **Target & Resolution**:\n  - Target is modern `ES2023`. Native array/object methods (e.g. `toSorted()`, modern array features) are supported natively.\n  - Bundler module resolution (`moduleResolution: \"bundler\"`).\n\n### Framework-Specific Rules\n\n- **Component Architecture**:\n  - Components are typed with `React.FC<Props>` and explicit interface definitions (`interface ComponentNameProps { ... }`).\n  - Use named exports consistently (`export const ComponentName: React.FC<Props> = ...`).\n  - Place all UI components in `src/components/`.\n- **State Management (Zustand)**:\n  - Global state is accessed via `useJiraStore` from `src/store/useJiraStore.ts`.\n  - State is persisted to `localStorage` under key `'jira-kanban-storage'`.\n  - Keep state updates strictly immutable (use `map`, `filter`, spread syntax).\n  - Issue IDs must strictly conform to `PROJ-${number}` auto-incremented from current store state.\n  - Modals and edit states are managed centrally through store actions (`openModal`, `closeModal`, `selectedIssue`).\n- **Interactive Event Handling**:\n  - Nested interactive controls inside clickable cards (such as status selectors or actions) must call `e.stopPropagation()` or guard via `closest()` to prevent unintentionally triggering card modals.\n- **Theme Synchronization**:\n  - Theme preference is tracked via `localStorage.getItem('jira-theme-preference')` with fallback to `window.matchMedia('(prefers-color-scheme: light)')`.\n  - Themes are applied by setting `data-theme=\"light\"` or `data-theme=\"dark\"` on `document.documentElement`.\n\n### Testing Rules\n\n- **Framework & Runner**:\n  - All automated tests run via Vitest (`npm test` executes `vitest run`).\n  - Environment is set to `jsdom` with `globals: true`.\n- **Test File Organization**:\n  - Tests must be placed inside `__tests__/` subdirectories adjacent to the target components (e.g., `src/components/__tests__/IssueCard.test.tsx`).\n  - File naming pattern: `<ComponentName>.test.tsx`.\n- **Global Setup & Environment Hygiene**:\n  - Global test setup resides in `src/test/setup.ts` which automatically clears `localStorage` and cleans up theme attributes in `beforeEach`.\n  - `window.matchMedia` is pre-mocked in `setup.ts`.\n- **Testing Conventions & Accessibility**:\n  - Query elements primarily through semantic ARIA roles and accessible text (`screen.getByRole`, `screen.getByLabelText`, `screen.getByText`).\n  - Always verify modal lifecycle: backdrop clicking, `Escape` keyboard shortcuts, close buttons, and state dispatch.\n  - Mock callbacks and handler spies using `vi.fn()`.\n\n### Code Quality & Style Rules\n\n- **Linter (Oxlint)**:\n  - Run lint verification via `npm run lint` (`oxlint`). Code must pass without warnings or errors.\n- **Design System & CSS Custom Properties**:\n  - Global styles and tokens are centralized in `src/styles.css`.\n  - Never hardcode hex color codes inside components; always consume design variables (e.g., `var(--bg-card)`, `var(--text-primary)`, `var(--accent-blue)`).\n  - Use semantic BEM-like class names (`issue-card`, `card-top`, `modal-backdrop`, `avatar-circle`) rather than inline style objects.\n- **Naming Conventions**:\n  - Components: `PascalCase.tsx` (e.g., `BoardView.tsx`, `IssueModal.tsx`).\n  - Zustand Stores: `camelCase.ts` prefixed with `use` (e.g., `useJiraStore.ts`).\n  - Domain Types: `kebab-case.ts` or `camelCase.ts` under `src/types/` (e.g., `jira.ts`).\n  - Unit Tests: `<ComponentName>.test.tsx` within an adjacent `__tests__/` directory.\n- **Clean Architecture & File Size**:\n  - Keep components modular. Separate modal presentation, column containers, and card rendering into dedicated files.\n\n### Development Workflow Rules\n\n- **Build & Verification Pipeline**:\n  - `npm run build` runs `tsc -b && vite build`. Any type discrepancy will block the build.\n  - `npm test` runs the entire Vitest suite headlessly. Run this before committing any feature or refactor.\n  - `npm run lint` runs Oxlint for rapid syntax and stylistic verification.\n- **Commit Conventions**:\n  - Follow Conventional Commits: `feat:`, `fix:`, `refactor:`, `test:`, `docs:`, `chore:` with issue key references where applicable (e.g., `feat: add swimlane filtering [PROJ-108]`).\n\n### Critical Don't-Miss Rules\n\n- 🛑 **Never use TypeScript Enums**:\n  - Enforced by `erasableSyntaxOnly`. Always use string union types (e.g. `'backlog' | 'todo' | 'in_progress' | 'in_review' | 'done'`).\n- 🛑 **Never import types as values**:\n  - Enforced by `verbatimModuleSyntax`. Always use `import type { ... } from ...`.\n- 🛑 **Never mutate Zustand state**:\n  - Always return new array and object references in `useJiraStore` actions (`map`, `filter`, spread).\n- 🛑 **Never bypass event containment in cards**:\n  - Any interactive element nested inside `.issue-card` (like `<select>`, buttons, or links) MUST stop event bubbling (`e.stopPropagation()` or `(e.target as HTMLElement).closest(...)`) to prevent unwanted card selection/modal triggers.\n- 🛑 **Never introduce external CSS-in-JS or Tailwind**:\n  - Maintain the native CSS custom properties system defined in `src/styles.css`.\n- ⚠️ **ID Generation Invariant**:\n  - New issue IDs MUST follow the `PROJ-${number}` sequence derived from the existing max number + 1.\n- ⚠️ **Date Invariants**:\n  - `createdAt` and `updatedAt` strings must adhere to `YYYY-MM-DD` (`new Date().toISOString().split('T')[0]`).\n\n---\n\n## Usage Guidelines\n\n**For AI Agents:**\n\n- Read this file before implementing any code\n- Follow ALL rules exactly as documented\n- When in doubt, prefer the more restrictive option\n- Update this file if new patterns emerge\n\n**For Humans:**\n\n- Keep this file lean and focused on agent needs\n- Update when technology stack changes\n- Review quarterly for outdated rules\n- Remove rules that become obvious over time\n\nLast Updated: 2026-09-09\n"}];</script>
