    <script>
      window.__ACL_EMBEDDED_FILES__ = [{"id":"_acl-output_1-analysis_acl-product-brief_brief_md","folderPath":"_acl-output/1-analysis/acl-product-brief","filename":"brief.md","status":"Approved","projectType":"brownfield","tier":"2","updatedAt":"2026-09-09T18:38:32.095Z","content":"﻿---\ntitle: \"Product Brief: Assignee Filter Option\"\nproject_type: brownfield\ntier: Tier 2 (Major Overhaul)\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-09T18:35:00.000Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ncreated: 2026-09-09\nupdated: 2026-09-09\n---\n\n# 🎯 Product Brief: Assignee Filter Option\n## Project: Jira Sprint Board (Brownfield Tier 2)\n\n---\n\n## 1. Executive Summary & Problem Statement\n\nIn the existing Jira Clone application, sprint board cards can be searched via text and filtered by priority (High, Medium, Low). However, as teams scale and boards fill with issues across multiple columns, developers and sprint leads struggle to quickly isolate tasks assigned to a specific engineer or view unassigned items needing triage.\n\nThe **Assignee Filter Option** introduces a dedicated assignee dropdown filter to the board query toolbar. This enables one-click filtering by team member (e.g., \"Karthick N\", \"Sarah L\") or \"Unassigned\", composing seamlessly with existing keyword search and priority filtering while persisting user filter preferences across sessions.\n\n---\n\n## 2. Strategic Value & Alignment\n\n- **Daily Standup Acceleration:** Individual engineers can isolate their active work items in a single click, eliminating visual noise during standup updates.\n- **Unassigned Backlog Triage:** Sprint masters can immediately filter for unassigned cards to assign ownership during planning and grooming sessions.\n- **Composability:** Integrates into the existing Zustand state store (`useJiraStore`) and board layout without altering the core Kanban drag-and-drop mechanics.\n\n---\n\n## 3. Scope & Blast Radius (Tier 2 Assessment)\n\n- **In Scope:**\n  - Dynamic extraction of unique assignees from the active issue collection.\n  - Dropdown UI component placed beside the Priority filter and Search input.\n  - Integration with the board's compound issue-filtering logic.\n  - Local persistence via Zustand storage key.\n- **Out of Scope:**\n  - Modifying the underlying issue data structure or backend sync API.\n  - Multi-select assignee filtering (single-select is sufficient for V1).\n\n---\n\n## 4. Upstream / Downstream Traceability\n\n- **Upstream Context:** Built against established patterns documented in `_acl-output/project-context.md`.\n- **Downstream Deliverables:** Feeds directly into `Phase 2: PRD` (`_acl-output/2-plan-workflows/acl-prd/prd.md`), `Phase 3A: Architecture Spine`, and `Phase 3B: Epics`.\r\n"},{"id":"_acl-output_2-plan-workflows_acl-prd_prd_md","folderPath":"_acl-output/2-plan-workflows/acl-prd","filename":"prd.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-09T18:36:04.153Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-09T18:36:04.142Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: Assignee Filter Option PRD\ncreated: 2026-09-09\nupdated: 2026-09-09\n---\n\n# 📋 Product Requirements Document (PRD)\n## Feature: Assignee Filter Option (Jira Sprint Board)\n\n---\n\n## 0. Document Purpose\n\nThis document defines the functional, technical, and operational requirements for the **Assignee Filter Option** feature on the Jira Clone Sprint Board. This PRD acts as the official contract between Product Management, Engineering, and QA for Phase 2 under ACL-ADLC sequential delivery protocol. It informs the downstream **Phase 3A Architecture Spine** and **Phase 3B Epics & Stories Breakdown**.\n\n---\n\n## 1. Product Vision & Executive Summary\n\nThe **Assignee Filter Option** empowers team members, engineering leads, and scrum masters to filter board tasks by individual team members or unassigned work items in a single click. As teams scale their sprint boards with dozens of issues across Backlog, To Do, In Progress, In Review, and Done, finding tickets assigned to a specific engineer becomes tedious. \n\nAdding an assignee filter dropdown alongside the existing Search query bar and Priority filter dropdown establishes a comprehensive, multi-dimensional query toolbar, dramatically improving sprint standup efficiency, personal workflow isolation, and individual task tracking.\n\n### Core Objectives\n1. **Targeted Task Focus:** Allow developers to isolate their personal tasks (e.g. \"Karthick N\") with zero noise during daily standups.\n2. **Unassigned Issue Triage:** Enable sprint leads to quickly isolate \"Unassigned\" issues for immediate sprint grooming and assignment.\n3. **Multi-Filter Composability:** Seamlessly compose Assignee filtering with existing text search (by title/key) and Priority filtering (High/Medium/Low).\n4. **Persistent State Experience:** Maintain selected assignee filter preferences across sessions and page refreshes via the established Zustand storage synchronizer.\n\n---\n\n## 2. Target User & Key User Journeys\n\n### 2.1 Target Personas\n- **Sprint Developer (Primary):** Wants to view only their assigned cards across all board columns to update progress and transition statuses during daily standup.\n- **Scrum Master / Lead (Secondary):** Wants to inspect individual member workload distributions, verify balanced assignments, or identify unassigned tickets requiring triage.\n\n### 2.2 User Journeys\n\n- **UJ-1: Engineer Filters for Personal Tickets During Standup**\n  - **Persona & Context:** Karthick (Senior Frontend Engineer) joins the daily 15-minute standup call.\n  - **Entry State:** Board displays 30+ mixed issues across all 5 columns. Search bar is empty, Priority filter is set to \"All Priorities\".\n  - **Path:**\n    1. Karthick clicks the \"Assignee\" filter dropdown in the header controls row.\n    2. He selects \"Karthick N\".\n    3. The board immediately filters issues across all columns to display only cards assigned to \"Karthick N\".\n    4. The header status statistics chips update or reflect the focused view.\n  - **Climax:** Karthick easily talks through his in-progress and in-review tickets without visual clutter.\n  - **Resolution:** Karthick concludes his update and resets the filter to return to full board view.\n\n- **UJ-2: Lead Identifies Unassigned Backlog Items**\n  - **Persona & Context:** Sarah (Engineering Manager / Scrum Lead) conducts sprint grooming.\n  - **Entry State:** Board has several issues in Backlog and To Do.\n  - **Path:**\n    1. Sarah opens the \"Assignee\" dropdown and selects \"Unassigned\".\n    2. The board isolates all tickets currently without an owner (`assignee: 'Unassigned'`).\n    3. Sarah clicks on an unassigned ticket, opens the modal, and assigns it to Alex Rivera.\n  - **Climax:** The reassigned ticket dynamically drops out of the \"Unassigned\" view in real-time.\n  - **Resolution:** All tickets in the sprint are cleanly owned.\n\n- **UJ-3: Multi-Criteria Filter Intersection & Reset**\n  - **Persona & Context:** Alex (Frontend Dev) searching for high-priority bugs assigned to Elena.\n  - **Entry State:** Board view is active.\n  - **Path:**\n    1. Alex sets Priority filter to \"High Priority\".\n    2. Alex sets Assignee filter to \"Elena Rostova\".\n    3. Board calculates intersection: `priority === 'high' && assignee === 'Elena Rostova'`.\n    4. If no tickets match, the board renders the empty search state with a \"Reset Search & Filters\" button.\n    5. Alex clicks \"Reset Search & Filters\", which resets Assignee to \"All Assignees\", Priority to \"All Priorities\", and Search to `\"\"`.\n  - **Climax:** Smooth recovery from zero-result intersections.\n\n---\n\n## 3. Domain Glossary\n\n- **Assignee:** The team member string associated with an issue (e.g., `'Karthick N'`, `'Sarah Connor'`, `'Unassigned'`).\n- **Assignee Filter (`assigneeFilter`):** Global store state string representing current filter selection: `'all' | string`.\n- **Composite Filtering:** The logical AND evaluation: `matchesSearch && matchesPriority && matchesAssignee`.\n- **Dynamic Assignee Extraction:** Deriving unique assignee names programmatically from the current `issues` collection, deduplicating, sorting alphabetically, and ensuring `'Unassigned'` is handled cleanly.\n\n---\n\n## 4. Functional Requirements\n\n### FR-1: Assignee Filter State in Zustand Store\n- **FR-1.1:** Extend `JiraState` with `assigneeFilter: string` initialized to `'all'`.\n- **FR-1.2:** Add action `setAssigneeFilter: (assignee: string) => void` updating state immutably.\n- **FR-1.3:** Include `assigneeFilter` in Zustand `persist` whitelist/partialize array so selection persists across browser reloads.\n\n### FR-2: Dynamic Assignee Options Extraction\n- **FR-2.1:** The UI must extract unique assignees dynamically from `issues` in `useJiraStore`.\n- **FR-2.2:** The dropdown options must always include:\n  1. `\"All Assignees\"` (value: `'all'`) as the default first option.\n  2. Alphabetically sorted unique assignee names present in the system.\n  3. `\"Unassigned\"` (if unassigned issues exist) positioned at the bottom or logically sorted.\n- **FR-2.3:** If an assignee is deleted or renamed while selected, the store must gracefully fall back to `'all'`.\n\n### FR-3: Header Controls Row UI Integration\n- **FR-3.1:** Place the Assignee Filter control adjacent to the Priority Filter inside `.search-filter-wrapper` in `src/components/Header.tsx`.\n- **FR-3.2:** Maintain consistent layout styling:\n  - Icon: Lucide `User` or `Users` icon (`size={15}`).\n  - Label: `<span class=\"filter-label\">Assignee:</span>`.\n  - Dropdown: `<select className=\"assignee-select\">` mirroring `.priority-select` styles.\n- **FR-3.3:** Maintain responsive wrapping across desktop and tablet screen widths without breaking the `.header-stats-chips` layout.\n\n### FR-4: Board View Filtering & Empty State Integration\n- **FR-4.1:** Update `filteredIssues` `useMemo` in `src/components/BoardView.tsx` to evaluate:\n  ```typescript\n  const matchesAssignee = assigneeFilter === 'all' || issue.assignee === assigneeFilter;\n  return matchesSearch && matchesPriority && matchesAssignee;\n  ```\n- **FR-4.2:** Update `hasActiveFilters` in `BoardView.tsx`:\n  ```typescript\n  const hasActiveFilters = searchQuery !== '' || priorityFilter !== 'all' || assigneeFilter !== 'all';\n  ```\n- **FR-4.3:** Update `resetFilters` function in `BoardView.tsx` to call `setAssigneeFilter('all')`.\n- **FR-4.4:** In the empty state message (`.no-search-results`), display the active assignee filter when active (e.g. `assigned to \"Sarah Connor\"`).\n\n---\n\n## 5. Non-Functional Requirements\n\n- **NFR-1 (Zero Mutation & Zustand Invariants):** Actions must strictly adhere to project invariants in `_acl-output/project-context.md`. Never mutate state directly.\n- **NFR-2 (Strict TypeScript Compliance):** `verbatimModuleSyntax` and `erasableSyntaxOnly` must be strictly respected. No TypeScript enums. Use `import type` for type-only imports.\n- **NFR-3 (Performance):** Filter calculations in `useMemo` must execute in `<16ms` (sub-frame) for up to 1,000 issues.\n- **NFR-4 (Styling Integrity):** Leverage existing CSS custom variables in `src/styles.css` without introducing external utility frameworks or conflicting inline overrides.\n- **NFR-5 (Test Verification):** Maintain 100% pass rate in Vitest unit and integration test suite (`npm test`).\n\n---\n\n## 6. Assumptions & Open Questions\n\n- `[ASSUMPTION]` **Dynamic vs Static Roster:** Dynamic extraction from active issues is preferred for Brownfield v1, as no centralized user/employee database table currently exists in `useJiraStore.ts`.\n- `[ASSUMPTION]` **Single-Select Dropdown:** A single-select `<select>` element aligns with the current Priority filter design language and avoids introducing heavyweight multi-select libraries.\n- `[ASSUMPTION]` **Reset Behavior:** \"Reset Search & Filters\" resets all three controls (searchQuery, priorityFilter, assigneeFilter) simultaneously.\n\n---\n\n## 7. Downstream Traceability\n\nUpon manager sign-off of this PRD in Markdown Studio:\n- **Phase 3A:** Technical architecture spine (`_acl-output/3-solutioning/acl-architecture/ARCHITECTURE-SPINE.md`) will define interface contracts, state migration strategy, and component hierarchy.\n- **Phase 3B:** Epics & Stories breakdown (`_acl-output/3-solutioning/acl-create-epics-and-stories/epics.md`) will break down the implementation tasks for store enhancement, header UI, and board filtering.\n"},{"id":"_acl-output_3-solutioning_acl-architecture_ARCHITECTURE-SPINE_md","folderPath":"_acl-output/3-solutioning/acl-architecture","filename":"ARCHITECTURE-SPINE.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-11T03:55:25.590Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-10T05:59:15.596Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\ntitle: Assignee Filter Architecture Spine\r\ncreated: 2026-09-09\r\nupdated: 2026-09-09\r\n---\r\n\r\n# 🏛️ Architecture Spine: Assignee Filer Option\r\n## System Solutioning & Invariant Contract (Phase 3A)\r\n\r\n---\r\n\r\n## 1. Context & Architectural Altitude\r\n\r\n- **System Context:** Jira Kanban Sprint Board (`jira-clone`), a React 19 + TypeScript + Zustand client application.\r\n- **Architectural Scope:** Integration of an Assignee Filter dimension into the existing global state store, header controls toolbar, and board filtering pipeline.\r\n- **Prerequisite Invariant:** Derives from the approved PRD (`_acl-output/2-plan-workflows/acl-prd/prd.md`) with zero regressions to existing board operations, card drag-and-drop, modals, or test suites.\r\n\r\n---\r\n\r\n## 2. Core Paradigm & Invariants\r\n\r\n```mermaid\r\nflowchart TD\r\n    subgraph UI [\"Presentation Layer (React 19)\"]\r\n        H[\"Header.tsx<br/>(Assignee Select Dropdown)\"]\r\n        BV[\"BoardView.tsx<br/>(Filtered Issues Memo)\"]\r\n        KC[\"KanbanColumn.tsx<br/>(Render Column Cards)\"]\r\n    end\r\n\r\n    subgraph State [\"Global State Layer (Zustand 5)\"]\r\n        JS[\"useJiraStore<br/>- assigneeFilter: string<br/>- setAssigneeFilter(assignee)\"]\r\n        PS[\"persist Middleware<br/>(localStorage sync)\"]\r\n    end\r\n\r\n    H -->|User Selects Assignee| JS\r\n    JS -->|Sync State| PS\r\n    JS -->|Reactive Subscription| BV\r\n    BV -->|Passes filtered issues| KC\r\n    BV -->|Reset Action| JS\r\n```\r\n\r\n### Architectural Decisions (ADs)\r\n\r\n#### AD-01: State Slicing in `useJiraStore` [ADOPTED]\r\n- **Binds:** `src/store/useJiraStore.ts`\r\n- **Prevents:** State synchronization fragmentation across disparate React local states.\r\n- **Rule:** \r\n  - Add `assigneeFilter: string` to `JiraState` with initial default value `'all'`.\r\n  - Add `setAssigneeFilter: (assignee: string) => void` to actions.\r\n  - State updates MUST be immutable (return new object reference without mutating previous state).\r\n  - Include `assigneeFilter` in the `persist` middleware storage configuration so user filter preferences persist across page reloads.\r\n\r\n#### AD-02: Dynamic Assignee Extraction & Normalization [ADOPTED]\r\n- **Binds:** `src/components/Header.tsx`\r\n- **Prevents:** Hardcoded team member lists diverging from issues created/edited in the board.\r\n- **Rule:**\r\n  - Extract unique assignees dynamically from the store's `issues` collection:\r\n    ```typescript\r\n    const uniqueAssignees = useMemo(() => {\r\n      const names = new Set(issues.map((i) => i.assignee).filter(Boolean));\r\n      return Array.from(names).sort((a, b) => a.localeCompare(b));\r\n    }, [issues]);\r\n    ```\r\n  - The dropdown renders:\r\n    1. `<option value=\"all\">All Assignees</option>` (default).\r\n    2. Dynamic assignee names mapped alphabetically.\r\n  - If the active `assigneeFilter` is not in the extracted list and not `'all'`, gracefully fallback to `'all'`.\r\n\r\n#### AD-03: Composite Multi-Filter Evaluation [ADOPTED]\r\n- **Binds:** `src/components/BoardView.tsx`\r\n- **Prevents:** Inconsistent or conflicting filter predicates between search, priority, and assignee.\r\n- **Rule:**\r\n  - All filter criteria are composed using strict logical AND:\r\n    ```typescript\r\n    const filteredIssues = useMemo(() => {\r\n      return issues.filter((issue) => {\r\n        const matchesSearch =\r\n          searchQuery.trim() === '' ||\r\n          issue.title.toLowerCase().includes(searchQuery.toLowerCase()) ||\r\n          issue.id.toLowerCase().includes(searchQuery.toLowerCase()) ||\r\n          issue.assignee.toLowerCase().includes(searchQuery.toLowerCase());\r\n\r\n        const matchesPriority =\r\n          priorityFilter === 'all' || issue.priority === priorityFilter;\r\n\r\n        const matchesAssignee =\r\n          assigneeFilter === 'all' || issue.assignee === assigneeFilter;\r\n\r\n        return matchesSearch && matchesPriority && matchesAssignee;\r\n      });\r\n    }, [issues, searchQuery, priorityFilter, assigneeFilter]);\r\n    ```\r\n\r\n#### AD-04: Composite Filter State Invalidation & Reset [ADOPTED]\r\n- **Binds:** `src/components/BoardView.tsx`\r\n- **Prevents:** Stale empty states and orphaned active filter conditions.\r\n- **Rule:**\r\n  - Active filter detector:\r\n    ```typescript\r\n    const hasActiveFilters = searchQuery !== '' || priorityFilter !== 'all' || assigneeFilter !== 'all';\r\n    ```\r\n  - The `resetFilters` handler MUST atomically reset all filter vectors:\r\n    ```typescript\r\n    const resetFilters = () => {\r\n      setSearchQuery('');\r\n      setPriorityFilter('all');\r\n      setAssigneeFilter('all');\r\n    };\r\n    ```\r\n\r\n#### AD-05: Strict TypeScript & CSS System Invariants [ADOPTED]\r\n- **Binds:** Global codebase (`src/styles.css`, `src/types/jira.ts`)\r\n- **Prevents:** Build failures and style regression against `project-context.md`.\r\n- **Rule:**\r\n  - No TypeScript Enums. Use string union or string primitive.\r\n  - Types imported using `import type { ... }` (`verbatimModuleSyntax`).\r\n  - Use native CSS custom properties in `.assignee-filter-container` matching `.priority-filter-container`:\r\n    - `var(--border-color)`\r\n    - `var(--bg-canvas)`\r\n    - `var(--text-primary)`\r\n    - `var(--radius-md)`\r\n  - No external styling packages or Tailwind classes introduced.\r\n\r\n---\r\n\r\n## 3. Component Contract & Interface Delta\r\n\r\n```typescript\r\n// Interface delta in src/store/useJiraStore.ts\r\nexport interface JiraState {\r\n  // Existing state...\r\n  issues: Issue[];\r\n  searchQuery: string;\r\n  priorityFilter: Priority | 'all';\r\n  assigneeFilter: string; // <-- NEW\r\n  selectedIssue: Issue | null;\r\n  isModalOpen: boolean;\r\n  modalInitialStatus: IssueStatus;\r\n\r\n  // Existing actions...\r\n  setSearchQuery: (query: string) => void;\r\n  setPriorityFilter: (priority: Priority | 'all') => void;\r\n  setAssigneeFilter: (assignee: string) => void; // <-- NEW\r\n  // ...\r\n}\r\n```\r\n\r\n---\r\n\r\n## 4. Verification & Testing Strategy\r\n\r\n1. **Store Unit Tests (`src/store/__tests__/useJiraStore.test.ts`):**\r\n   - Verify initial `assigneeFilter` is `'all'`.\r\n   - Verify `setAssigneeFilter` updates filter value immutably.\r\n   - Verify filter resets cleanly with `resetFilters`.\r\n2. **Component Integration Tests (`src/components/__tests__/BoardFiltering.test.tsx`):**\r\n   - Verify rendering of Assignee dropdown with dynamic options.\r\n   - Verify selecting an assignee hides non-matching cards across columns.\r\n   - Verify multi-filter composition (Assignee + Priority).\r\n   - Verify empty state message displays active assignee and reset button works.\r\n3. **Regression Suite:**\r\n   - Execute `npm test` and `npm run lint` with 100% pass guarantee.\r\n"},{"id":"_acl-output_3-solutioning_acl-create-epics-and-stories_epics_md","folderPath":"_acl-output/3-solutioning/acl-create-epics-and-stories","filename":"epics.md","status":"Approved","projectType":null,"tier":null,"updatedAt":"2026-09-10T04:35:44.243Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-09T18:39:43.033Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: Assignee Filter Epics & Stories Breakdown\ncreated: 2026-09-09\nupdated: 2026-09-09\n---\n\n# 📋 Epics & User Stories Breakdown: Assignee Filter Option\n## Implementation Backlog (Phase 3B)\n\n---\n\n## Overview\n\nThis backlog outlines the epics and granular user stories required to implement the **Assignee Filter Option** on the Jira Kanban board. It adheres strictly to the approved **PRD** (`_acl-output/2-plan-workflows/acl-prd/prd.md`) and **Architecture Spine** (`_acl-output/3-solutioning/acl-architecture/ARCHITECTURE-SPINE.md`).\n\n---\n\n## Epic 1: Global State & Filter Store Enhancement\n\n### Story 1.1: Extend Zustand Store with Assignee State & Action\n- **Description:** Update `src/store/useJiraStore.ts` to support global `assigneeFilter` state, defaulting to `'all'`, with immutable setter actions and localStorage persistence.\n- **Acceptance Criteria:**\n  - [x] Add `assigneeFilter: string` to `JiraState` interface initialized to `'all'`.\n  - [x] Add `setAssigneeFilter: (assignee: string) => void` action that returns a new state object immutably.\n  - [x] Include `assigneeFilter` in the `persist` middleware storage configuration so preferences persist across browser reloads.\n  - [x] Ensure strict TypeScript compliance under `verbatimModuleSyntax` and `erasableSyntaxOnly`.\n\n### Story 1.2: Store Unit Tests for Assignee Filter\n- **Description:** Implement unit tests in `src/store/__tests__/useJiraStore.test.ts` to test state transitions and immutability.\n- **Acceptance Criteria:**\n  - [x] Test verifying default `assigneeFilter` is `'all'`.\n  - [x] Test verifying calling `setAssigneeFilter('Sarah Connor')` updates state cleanly.\n  - [x] Test verifying updating `assigneeFilter` does not mutate issues or other store properties.\n\n---\n\n## Epic 2: Header Filter Controls & Responsive Styling\n\n### Story 2.1: Assignee Filter UI Component in Header\n- **Description:** Integrate the Assignee Filter selector into `src/components/Header.tsx` inside the `.search-filter-wrapper`.\n- **Acceptance Criteria:**\n  - [x] Dynamically compute `uniqueAssignees` from `issues` using `useMemo`, sorting alphabetically.\n  - [x] Render a `.assignee-filter-container` with Lucide `User` icon (`size={15}`) and `<span className=\"filter-label\">Assignee:</span>`.\n  - [x] Render `<select className=\"assignee-select\">` bound to `assigneeFilter` and `setAssigneeFilter`.\n  - [x] Include `<option value=\"all\">All Assignees</option>` as the first option followed by mapped assignees.\n\n### Story 2.2: CSS Custom Properties & Responsive Layout\n- **Description:** Add CSS rules in `src/styles.css` for `.assignee-filter-container` and `.assignee-select`.\n- **Acceptance Criteria:**\n  - [x] Match existing design tokens from `.priority-filter-container` and `.priority-select`.\n  - [x] Maintain responsive flex-wrapping on narrow and tablet viewports without clipping `.header-stats-chips`.\n  - [x] Avoid introducing external CSS libraries or modifying global design variables.\n\n---\n\n## Epic 3: Board View Filtering & Empty State Integration\n\n### Story 3.1: Composite Filtering in Board View\n- **Description:** Update the filtering pipeline in `src/components/BoardView.tsx` to include `assigneeFilter`.\n- **Acceptance Criteria:**\n  - [x] Update `filteredIssues` `useMemo` dependency array to include `assigneeFilter`.\n  - [x] Evaluate composite filter condition: `matchesSearch && matchesPriority && matchesAssignee`.\n  - [x] Ensure issues without an assignee or assigned to \"Unassigned\" are filterable via `'Unassigned'`.\n\n### Story 3.2: Empty Results State & Filter Reset\n- **Description:** Enhance empty state feedback and reset functionality in `src/components/BoardView.tsx`.\n- **Acceptance Criteria:**\n  - [x] Update `hasActiveFilters` to evaluate `searchQuery !== '' || priorityFilter !== 'all' || assigneeFilter !== 'all'`.\n  - [x] Update `resetFilters` handler to call `setAssigneeFilter('all')`, resetting all filters atomically.\n  - [x] In the empty state message (`.no-search-results`), display the active assignee filter when active.\n\n### Story 3.3: Integration Testing & Verification\n- **Description:** Validate full board filtering behavior and run end-to-end test assertions.\n- **Acceptance Criteria:**\n  - [x] Verify that selecting an assignee filters cards correctly across Backlog, To Do, In Progress, In Review, and Done columns.\n  - [x] Verify that composite filters (Search + Priority + Assignee) compute the intersection accurately.\n  - [x] Ensure all existing tests in `src/components/__tests__/` continue to pass with `npm test`.\n  - [x] Run `npm run lint` with 0 errors.\n"},{"id":"_acl-output_4-implementation_story-1-1_md","folderPath":"_acl-output/4-implementation","filename":"story-1-1.md","status":"Approved","projectType":null,"tier":"2","updatedAt":"2026-09-10T04:30:52.855Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-09T19:03:55.368Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 1.1: Extend Zustand Store with Assignee State & Action\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"1.1\"\nepic_id: \"1\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 1.1: Extend Zustand Store with Assignee State & Action\n\n## Overview & Scope\nUpdate the global store in `src/store/useJiraStore.ts` to introduce global `assigneeFilter` state, defaulting to `'all'`, with an immutable setter action and localStorage persistence.\n\n## Technical Contract\n- **State Interface**:\n  - Add `assigneeFilter: string` property to `JiraState` interface.\n  - Default value: `'all'`.\n- **Actions**:\n  - Add `setAssigneeFilter: (assignee: string) => void` action.\n  - State transition must update `assigneeFilter` immutably without altering `issues`, `columns`, or other store slices.\n- **Persistence Middleware**:\n  - Ensure `assigneeFilter` is included in the `persist` middleware whitelist/storage config.\n- **Compiler Compatibility**:\n  - Strict TypeScript compliance under `verbatimModuleSyntax` and `erasableSyntaxOnly`.\n\n## Acceptance Criteria\n- [x] Add `assigneeFilter: string` to `JiraState` interface initialized to `'all'`.\n- [x] Add `setAssigneeFilter: (assignee: string) => void` action that returns a new state object immutably.\n- [x] Include `assigneeFilter` in the `persist` middleware storage configuration so preferences persist across browser reloads.\n- [x] Ensure strict TypeScript compliance under `verbatimModuleSyntax` and `erasableSyntaxOnly`.\n"},{"id":"_acl-output_4-implementation_story-1-2_md","folderPath":"_acl-output/4-implementation","filename":"story-1-2.md","status":"Approved","projectType":null,"tier":"2","updatedAt":"2026-09-11T03:55:25.601Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-10T08:06:04.354Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\ntitle: \"Story 1.2: Store Unit Tests for Assignee Filter\"\r\ntier: Tier 2 (Major Overhaul)\r\nstory_id: \"1.2\"\r\nepic_id: \"1\"\r\ncreated: 2026-09-10\r\n---\r\n\r\n# 📦 Story 1.2: Store Unit Tests for Assignee Filter\r\n\r\n## Overview & Scope\r\nImplement unit tests in `src/store/__tests__/useJiraStore.test.ts` to verify state transitions and immutability for the newly added `assigneeFilter` store property and `setAssigneeFilter` action.\r\n\r\n## Technical Contract\r\n- **Test File**: `src/store/__tests__/useJiraStore.test.ts`\r\n- **Assertions**:\r\n  - Verify that the initial `assigneeFilter` state evaluates to `'all'`.\r\n  - Verify that invoking `useJiraStore.getState().setAssigneeFilter('Sarah Connor')` updates `assigneeFilter` to `'Sarah Connor'`.\r\n  - Verify that invoking `setAssigneeFilter` preserves the existing `issues` list, `searchQuery`, `priorityFilter`, and other store properties without mutations.\r\n- **Test Framework**: Vitest.\r\n\r\n## Acceptance Criteria\r\n- [x] Test verifying default `assigneeFilter` is `'all'`.\r\n- [x] Test verifying calling `setAssigneeFilter('Sarah Connor')` updates state cleanly.\r\n- [x] Test verifying updating `assigneeFilter` does not mutate issues or other store properties.\r\n"},{"id":"_acl-output_4-implementation_story-2-1_md","folderPath":"_acl-output/4-implementation","filename":"story-2-1.md","status":"In Review","projectType":null,"tier":"2","updatedAt":"2026-09-10T04:36:30.740Z","content":"---\nstatus: In Review\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-10T04:36:30.730Z\ngate_signature: ACL-STUDIO-APPROVAL-IN-REVIEW\ntitle: \"Story 2.1: Assignee Filter UI Component in Header\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"2.1\"\nepic_id: \"2\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 2.1: Assignee Filter UI Component in Header\n\n## Overview & Scope\nIntegrate the Assignee Filter selector dropdown into `src/components/Header.tsx` inside the `.search-filter-wrapper`, allowing users to select an assignee to filter the board.\n\n## Technical Contract\n- **Component File**: `src/components/Header.tsx`\n- **Dynamic Options**:\n  - Compute `uniqueAssignees` using `useMemo` from `issues` in `useJiraStore`, sorted alphabetically.\n- **UI Elements**:\n  - Render `.assignee-filter-container` containing:\n    - Lucide `User` icon (`size={15}`).\n    - `<span className=\"filter-label\">Assignee:</span>`.\n    - `<select className=\"assignee-select\">` bound to `assigneeFilter` value and `setAssigneeFilter` change handler.\n    - First option: `<option value=\"all\">All Assignees</option>`.\n    - Followed by mapped `<option>` items for each unique assignee.\n\n## Acceptance Criteria\n- [x] Dynamically compute `uniqueAssignees` from `issues` using `useMemo`, sorting alphabetically.\n- [x] Render a `.assignee-filter-container` with Lucide `User` icon (`size={15}`) and `<span className=\"filter-label\">Assignee:</span>`.\n- [x] Render `<select className=\"assignee-select\">` bound to `assigneeFilter` and `setAssigneeFilter`.\n- [x] Include `<option value=\"all\">All Assignees</option>` as the first option followed by mapped assignees.\n"},{"id":"_acl-output_4-implementation_story-2-2_md","folderPath":"_acl-output/4-implementation","filename":"story-2-2.md","status":"In Review","projectType":null,"tier":"2","updatedAt":"2026-09-10T04:36:35.657Z","content":"---\nstatus: In Review\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-10T04:36:35.636Z\ngate_signature: ACL-STUDIO-APPROVAL-IN-REVIEW\ntitle: \"Story 2.2: CSS Custom Properties & Responsive Layout\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"2.2\"\nepic_id: \"2\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 2.2: CSS Custom Properties & Responsive Layout\n\n## Overview & Scope\nAdd responsive CSS styling in `src/styles.css` for `.assignee-filter-container` and `.assignee-select`, matching existing design tokens from priority filter controls and maintaining flex-wrapping without viewport clipping.\n\n## Technical Contract\n- **Styles File**: `src/styles.css`\n- **Design Tokens**:\n  - Border radius, border colors, background colors, and typography matching `.priority-filter-container` and `.priority-select`.\n- **Responsive Layout**:\n  - Maintain flex layout with flex-wrap on narrow and tablet viewports, ensuring `.header-stats-chips` and filters wrap cleanly without layout shifts or horizontal clipping.\n- **Constraints**:\n  - Zero external CSS dependencies, preserve existing design system variables.\n\n## Acceptance Criteria\n- [x] Match existing design tokens from `.priority-filter-container` and `.priority-select`.\n- [x] Maintain responsive flex-wrapping on narrow and tablet viewports without clipping `.header-stats-chips`.\n- [x] Avoid introducing external CSS libraries or modifying global design variables.\n"},{"id":"_acl-output_4-implementation_story-3-1_md","folderPath":"_acl-output/4-implementation","filename":"story-3-1.md","status":"Rejected","projectType":null,"tier":"2","updatedAt":"2026-09-10T04:36:39.653Z","content":"---\nstatus: Rejected\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-10T04:36:39.639Z\ngate_signature: ACL-STUDIO-APPROVAL-REJECTED\ntitle: \"Story 3.1: Composite Filtering in Board View\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"3.1\"\nepic_id: \"3\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 3.1: Composite Filtering in Board View\n\n## Overview & Scope\nUpdate the issue filtering pipeline in `src/components/BoardView.tsx` to include `assigneeFilter`, performing multi-criteria filtering across search query, priority filter, and assignee filter.\n\n## Technical Contract\n- **Component File**: `src/components/BoardView.tsx`\n- **Filtering Logic**:\n  - `assigneeFilter` retrieved from `useJiraStore()`.\n  - Dependency array of `filteredIssues` `useMemo` includes `[issues, searchQuery, priorityFilter, assigneeFilter]`.\n  - Matching condition:\n    - If `assigneeFilter === 'all'`: matches all issues.\n    - If `assigneeFilter === 'Unassigned'`: matches issues with `!issue.assignee || issue.assignee === 'Unassigned'`.\n    - Otherwise: `issue.assignee === assigneeFilter`.\n  - Composite predicate: `matchesSearch && matchesPriority && matchesAssignee`.\n\n## Acceptance Criteria\n- [x] Update `filteredIssues` `useMemo` dependency array to include `assigneeFilter`.\n- [x] Evaluate composite filter condition: `matchesSearch && matchesPriority && matchesAssignee`.\n- [x] Ensure issues without an assignee or assigned to \"Unassigned\" are filterable via `'Unassigned'`.\n"},{"id":"_acl-output_4-implementation_story-3-2_md","folderPath":"_acl-output/4-implementation","filename":"story-3-2.md","status":"Approved","projectType":null,"tier":"2","updatedAt":"2026-09-11T04:28:00.984Z","content":"---\r\nstatus: Approved\r\nreviewed_by: Manager (via Markdown Studio)\r\nreview_timestamp: 2026-09-11T03:57:59.246Z\r\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\r\ntitle: \"Story 3.2: Empty Results State & Filter Reset\"\r\ntier: Tier 2 (Major Overhaul)\r\nstory_id: \"3.2\"\r\nepic_id: \"3\"\r\ncreated: 2026-09-10\r\n---\r\n\r\n# 📦 Story 3.2: Empty Results State & Filter Reset\r\n\r\n## Overview & Scope\r\nEnhance empty state feedback and atomic filter reset functionality in `src/components/BoardView.tsx` when no issues match the composite filters including assignee filter.\r\n\r\n## Technical Contract\r\n- **Component File**: `src/components/BoardView.tsx`\r\n- **Active Filters Evaluation**:\r\n  - `hasActiveFilters`: `searchQuery !== '' || priorityFilter !== 'all' || assigneeFilter !== 'all'`.\r\n- **Reset Handler**:\r\n  - `resetFilters` function resets `searchQuery` to `''`, `priorityFilter` to `'all'`, and `assigneeFilter` to `'all'`.\r\n- **Empty State Display**:\r\n  - In `.no-search-results`, display the active assignee filter message: `{assigneeFilter !== 'all' && ' assigned to \"' + assigneeFilter + '\"'}`.\r\n\r\n## Acceptance Criteria\r\n- [x] Update `hasActiveFilters` to evaluate `searchQuery !== '' || priorityFilter !== 'all' || assigneeFilter !== 'all'`.\r\n- [x] Update `resetFilters` handler to call `setAssigneeFilter('all')`, resetting all filters atomically.\r\n- [x] In the empty state message (`.no-search-results`), display the active assignee filter when active.\r\n"},{"id":"_acl-output_4-implementation_story-3-3_md","folderPath":"_acl-output/4-implementation","filename":"story-3-3.md","status":"Approved","projectType":null,"tier":"2","updatedAt":"2026-09-10T04:35:29.918Z","content":"---\nstatus: Approved\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: 2026-09-10T04:33:53.029Z\ngate_signature: ACL-STUDIO-APPROVAL-APPROVED\ntitle: \"Story 3.3: Integration Testing & Verification\"\ntier: Tier 2 (Major Overhaul)\nstory_id: \"3.3\"\nepic_id: \"3\"\ncreated: 2026-09-10\n---\n\n# 📦 Story 3.3: Integration Testing & Verification\n\n## Overview & Scope\nValidate board integration filtering, component assertions, composite filter intersection (search + priority + assignee), and full regression test suite pass with clean linting.\n\n## Technical Contract\n- **Test Execution**: `npm test` across all unit/integration test suites in `src/`.\n- **Lint Check**: `npm run lint` with 0 warnings or errors.\n- **Validation**:\n  - Verify cards filter accurately across Backlog, To Do, In Progress, In Review, and Done columns when an assignee is selected.\n  - Verify composite filter computes logical intersection (`AND`).\n  - Verify zero regressions across existing board and modal components.\n\n## Acceptance Criteria\n- [x] Verify that selecting an assignee filters cards correctly across Backlog, To Do, In Progress, In Review, and Done columns.\n- [x] Verify that composite filters (Search + Priority + Assignee) compute the intersection accurately.\n- [x] Ensure all existing tests in `src/components/__tests__/` continue to pass with `npm test`.\n- [x] Run `npm run lint` with 0 errors.\n"},{"id":"_acl-output_project-context_md","folderPath":"_acl-output","filename":"project-context.md","status":"Approved","projectType":"brownfield","tier":null,"updatedAt":"2026-09-09T18:10:05.941Z","content":"---\nproject_name: 'jira-clone'\nproject_type: brownfield\nuser_name: 'Karthick.natarajan'\ndate: '2026-09-09'\nsections_completed: ['technology_stack', 'language_rules', 'framework_rules', 'testing_rules', 'quality_rules', 'workflow_rules', 'anti_patterns']\nstatus: 'Accepted'\nrule_count: 27\noptimized_for_llm: true\n---\n\n# Project Context for AI Agents\n\n_This file contains critical rules and patterns that AI agents must follow when implementing code in this project. Focus on unobvious details that agents might otherwise miss._\n\n---\n\n## Technology Stack & Versions\n\n- **Framework & Runtime**: React 19.2.7, TypeScript 6.0.2 (targeting ES2023, bundler resolution)\n- **Build Tooling**: Vite 8.1.1 (@vitejs/plugin-react 6.0.3), Oxlint 1.71.0\n- **State Management**: Zustand 5.0.14 (`zustand/middleware` persist used for local storage synchronization)\n- **Iconography**: Lucide React 1.26.0\n- **Test Suite**: Vitest 5.0.0, JSDOM 29.1.1, @testing-library/react 16.3.3, @testing-library/jest-dom 7.0.1\n- **Compatibility Notes**:\n  - React 19 rules apply (use modern hooks; avoid deprecated legacy APIs).\n  - TypeScript strict erasable syntax & verbatim module syntax are enforced.\n\n## Critical Implementation Rules\n\n### Language-Specific Rules\n\n- **Strict Type-Only Imports (`verbatimModuleSyntax: true`)**:\n  - Always use `import type { ... } from '...'` when importing interfaces, type aliases, or type definitions.\n  - Never mix value and type imports in a single non-type import statement if the type is solely used for typing.\n- **Erasable Syntax Only (`erasableSyntaxOnly: true`)**:\n  - **No TypeScript Enums**: Use string literal union types instead (e.g., `export type Priority = 'low' | 'medium' | 'high'`).\n  - Do not use runtime TypeScript constructs such as namespaces or parameter properties in class constructors.\n- **Zero Unused Symbols**:\n  - `noUnusedLocals` and `noUnusedParameters` are enabled. Unused variables, imports, or parameters will cause build failures during `tsc -b`. Prefix intentional unused handler parameters with `_`.\n- **Target & Resolution**:\n  - Target is modern `ES2023`. Native array/object methods (e.g. `toSorted()`, modern array features) are supported natively.\n  - Bundler module resolution (`moduleResolution: \"bundler\"`).\n\n### Framework-Specific Rules\n\n- **Component Architecture**:\n  - Components are typed with `React.FC<Props>` and explicit interface definitions (`interface ComponentNameProps { ... }`).\n  - Use named exports consistently (`export const ComponentName: React.FC<Props> = ...`).\n  - Place all UI components in `src/components/`.\n- **State Management (Zustand)**:\n  - Global state is accessed via `useJiraStore` from `src/store/useJiraStore.ts`.\n  - State is persisted to `localStorage` under key `'jira-kanban-storage'`.\n  - Keep state updates strictly immutable (use `map`, `filter`, spread syntax).\n  - Issue IDs must strictly conform to `PROJ-${number}` auto-incremented from current store state.\n  - Modals and edit states are managed centrally through store actions (`openModal`, `closeModal`, `selectedIssue`).\n- **Interactive Event Handling**:\n  - Nested interactive controls inside clickable cards (such as status selectors or actions) must call `e.stopPropagation()` or guard via `closest()` to prevent unintentionally triggering card modals.\n- **Theme Synchronization**:\n  - Theme preference is tracked via `localStorage.getItem('jira-theme-preference')` with fallback to `window.matchMedia('(prefers-color-scheme: light)')`.\n  - Themes are applied by setting `data-theme=\"light\"` or `data-theme=\"dark\"` on `document.documentElement`.\n\n### Testing Rules\n\n- **Framework & Runner**:\n  - All automated tests run via Vitest (`npm test` executes `vitest run`).\n  - Environment is set to `jsdom` with `globals: true`.\n- **Test File Organization**:\n  - Tests must be placed inside `__tests__/` subdirectories adjacent to the target components (e.g., `src/components/__tests__/IssueCard.test.tsx`).\n  - File naming pattern: `<ComponentName>.test.tsx`.\n- **Global Setup & Environment Hygiene**:\n  - Global test setup resides in `src/test/setup.ts` which automatically clears `localStorage` and cleans up theme attributes in `beforeEach`.\n  - `window.matchMedia` is pre-mocked in `setup.ts`.\n- **Testing Conventions & Accessibility**:\n  - Query elements primarily through semantic ARIA roles and accessible text (`screen.getByRole`, `screen.getByLabelText`, `screen.getByText`).\n  - Always verify modal lifecycle: backdrop clicking, `Escape` keyboard shortcuts, close buttons, and state dispatch.\n  - Mock callbacks and handler spies using `vi.fn()`.\n\n### Code Quality & Style Rules\n\n- **Linter (Oxlint)**:\n  - Run lint verification via `npm run lint` (`oxlint`). Code must pass without warnings or errors.\n- **Design System & CSS Custom Properties**:\n  - Global styles and tokens are centralized in `src/styles.css`.\n  - Never hardcode hex color codes inside components; always consume design variables (e.g., `var(--bg-card)`, `var(--text-primary)`, `var(--accent-blue)`).\n  - Use semantic BEM-like class names (`issue-card`, `card-top`, `modal-backdrop`, `avatar-circle`) rather than inline style objects.\n- **Naming Conventions**:\n  - Components: `PascalCase.tsx` (e.g., `BoardView.tsx`, `IssueModal.tsx`).\n  - Zustand Stores: `camelCase.ts` prefixed with `use` (e.g., `useJiraStore.ts`).\n  - Domain Types: `kebab-case.ts` or `camelCase.ts` under `src/types/` (e.g., `jira.ts`).\n  - Unit Tests: `<ComponentName>.test.tsx` within an adjacent `__tests__/` directory.\n- **Clean Architecture & File Size**:\n  - Keep components modular. Separate modal presentation, column containers, and card rendering into dedicated files.\n\n### Development Workflow Rules\n\n- **Build & Verification Pipeline**:\n  - `npm run build` runs `tsc -b && vite build`. Any type discrepancy will block the build.\n  - `npm test` runs the entire Vitest suite headlessly. Run this before committing any feature or refactor.\n  - `npm run lint` runs Oxlint for rapid syntax and stylistic verification.\n- **Commit Conventions**:\n  - Follow Conventional Commits: `feat:`, `fix:`, `refactor:`, `test:`, `docs:`, `chore:` with issue key references where applicable (e.g., `feat: add swimlane filtering [PROJ-108]`).\n\n### Critical Don't-Miss Rules\n\n- 🛑 **Never use TypeScript Enums**:\n  - Enforced by `erasableSyntaxOnly`. Always use string union types (e.g. `'backlog' | 'todo' | 'in_progress' | 'in_review' | 'done'`).\n- 🛑 **Never import types as values**:\n  - Enforced by `verbatimModuleSyntax`. Always use `import type { ... } from ...`.\n- 🛑 **Never mutate Zustand state**:\n  - Always return new array and object references in `useJiraStore` actions (`map`, `filter`, spread).\n- 🛑 **Never bypass event containment in cards**:\n  - Any interactive element nested inside `.issue-card` (like `<select>`, buttons, or links) MUST stop event bubbling (`e.stopPropagation()` or `(e.target as HTMLElement).closest(...)`) to prevent unwanted card selection/modal triggers.\n- 🛑 **Never introduce external CSS-in-JS or Tailwind**:\n  - Maintain the native CSS custom properties system defined in `src/styles.css`.\n- ⚠️ **ID Generation Invariant**:\n  - New issue IDs MUST follow the `PROJ-${number}` sequence derived from the existing max number + 1.\n- ⚠️ **Date Invariants**:\n  - `createdAt` and `updatedAt` strings must adhere to `YYYY-MM-DD` (`new Date().toISOString().split('T')[0]`).\n\n---\n\n## Usage Guidelines\n\n**For AI Agents:**\n\n- Read this file before implementing any code\n- Follow ALL rules exactly as documented\n- When in doubt, prefer the more restrictive option\n- Update this file if new patterns emerge\n\n**For Humans:**\n\n- Keep this file lean and focused on agent needs\n- Update when technology stack changes\n- Review quarterly for outdated rules\n- Remove rules that become obvious over time\n\nLast Updated: 2026-09-09\n"}];

        <div class="nav-drawer-section-label">📊 Dashboard</div>
        <!-- Sub-item 1: Summarized -->
        <button type="button" class="nav-drawer-item sub-item" id="navItemSummarized" onclick="switchAppView('dashboard-summarized')">
          <span class="nav-item-icon">📈</span>
          <div class="nav-item-text">
            <span class="nav-item-title">Summarized</span>
            <span class="nav-item-subtitle">Phases & Delivery Telemetry</span>
          </div>
        </button>
        <!-- Sub-item 2: Scrum Master -->
        <button type="button" class="nav-drawer-item sub-item" id="navItemScrum" onclick="switchAppView('dashboard-scrum')">
          <span class="nav-item-icon">🏃</span>
          <div class="nav-item-text">
            <span class="nav-item-title">Scrum Master</span>
            <span class="nav-item-subtitle">Epics & Stories Velocity</span>
          </div>
        </button>
        <!-- Sub-item 3: Developer -->
        <button type="button" class="nav-drawer-item sub-item" id="navItemDeveloper" onclick="switchAppView('dashboard-developer')">
          <span class="nav-item-icon">💻</span>
          <div class="nav-item-text">
            <span class="nav-item-title">Developer</span>
            <span class="nav-item-subtitle">Stories & Acceptance Criteria</span>
          </div>
        </button>

        <div class="nav-drawer-section-label" style="margin-top: 1.25rem">📝 Editor</div>
        <!-- Markdown Studio -->
        <button type="button" class="nav-drawer-item active" id="navItemStudio" onclick="switchAppView('studio')">
          <span class="nav-item-icon">📝</span>
          <div class="nav-item-text">
            <span class="nav-item-title">Markdown Studio</span>
            <span class="nav-item-subtitle">Document Editor & Manager Approval</span>
          </div>
        </button>
      </nav>
      <div class="nav-drawer-footer">
        <span>ACL-ADLC</span>
        <span id="drawerVersionLabel" style="font-weight: 700">v6.11.40</span>
      </div>
    </aside>

    <!-- Top Application Header -->
    <header>
      <div class="brand-container">
        <button type="button" class="btn-nav-drawer" id="btnNavDrawer" onclick="toggleNavDrawer()" title="Navigation Menu (☰)">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="brand">
          <img class="brand-logo" src="/velocityone-studio-logo.png" alt="VelocityONE Studio" />
          <span id="appHeaderTitle"></span>
        </div>
      </div>

      <div class="header-actions">
        <!-- Help: Delivery Workflow dropdown -->
        <div class="workflow-dropdown-wrapper" id="workflowDropdownWrapper">
          <button
            type="button"
            class="btn-workflow"
            id="btnWorkflow"
            onclick="toggleWorkflowDropdown(event)"
            title="Delivery Workflow"
            aria-label="Delivery Workflow"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          </button>
          <div class="workflow-menu" id="workflowMenu">
            <button type="button" class="workflow-menu-item" onclick="openWorkflowModal('greenfield', event)">Greenfield</button>
            <button type="button" class="workflow-menu-item" onclick="openWorkflowModal('brownfield', event)">Brownfield</button>
          </div>
        </div>

        <!-- Sync Status Indicator -->
        <div class="file-sync-indicator" id="syncStatus">
          <span>●</span>
          <span id="syncStatusText">Synced with VS code and Github</span>
        </div>

        <!-- Update Button -->
        <button class="btn-update" id="btnSave" onclick="saveCurrentFile()" title="Save & Sync with VS Code (Ctrl+S / Cmd+S)">
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span id="saveBtnText">Update</span>
        </button>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="app-container" id="studioView">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-controls">
          <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Search files, titles, or paths..." oninput="renderFileTree()" />
          </div>

          <div class="filter-grid">
            <select id="sortSelect" class="select-control" onchange="handleSortChange()" title="Sort Folders & Files">
              <option value="default" selected>⚡ Default</option>
              <option value="alpha-asc">🔤 Name (A → Z)</option>
              <option value="alpha-desc">🔤 Name (Z → A)</option>
              <option value="date-desc">🕒 Date (Newest)</option>
              <option value="date-asc">🕒 Date (Oldest)</option>
            </select>

            <select id="filterStatusSelect" class="select-control" onchange="renderFileTree()" title="Filter by Status">
              <option value="all">⚡ All Statuses</option>
              <option value="In Review">🟡 In Review</option>
              <option value="Approved">🟢 Approved</option>
              <option value="Rejected">🔴 Rejected</option>
            </select>
          </div>
        </div>

        <!-- File Tree -->
        <div class="file-tree-container" id="fileTreeRoot"></div>
      </aside>

      <!-- Workspace -->
      <main class="workspace">
        <div class="editor-status-bar">
          <div class="status-selection-area">
            <span class="status-label">Document Status:</span>
            <div class="status-select-wrap">
              <select id="statusSelect" class="status-select" onchange="onStatusChange(this.value)">
                <option value="In Review">🟡 In Review</option>
                <option value="Approved">🟢 Approved</option>
                <option value="Rejected">🔴 Rejected</option>
              </select>
            </div>
          </div>

          <div class="view-mode-group">
            <button class="view-mode-btn active" id="btnModePreview" onclick="setViewMode('preview')">
              <span>👁️</span>
              <span>Preview</span>
            </button>
            <button class="view-mode-btn" id="btnModeEdit" onclick="setViewMode('edit')">
              <span>✏️</span>
              <span>Edit</span>
            </button>
          </div>
        </div>

        <div class="editor-wrapper">
          <div id="markdownPreview" class="markdown-body"></div>
          <textarea
            id="markdownTextarea"
            class="markdown-textarea"
            placeholder="Select a Markdown file to start editing..."
            spellcheck="false"
            oninput="handleContentInput()"
          ></textarea>
        </div>
      </main>
    </div>

    <!-- Delivery Dashboard View (Read-Only, Clean Light Theme) -->
    <div class="dashboard-view" id="dashboardView">
      <div class="dashboard-container" id="dashboardContainerRoot">
        <!-- Dynamically generated by renderDeliveryDashboard() -->
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toastNotification">
      <span id="toastIcon">✔</span>
      <span id="toastMsg">Updated successfully</span>
    </div>

    <div class="workflow-modal-backdrop" id="workflowModal" onclick="closeWorkflowModal(event)">
      <div class="workflow-modal-card" onclick="event.stopPropagation()">
        <!-- Modal Header: ONLY X Close Button -->
        <div class="workflow-modal-header">
          <button class="workflow-close-btn" onclick="closeWorkflowModal()" title="Close (Esc)">✕</button>
        </div>

        <!-- Modal Body / SVG Viewport (Hidden Scrollbars & Interactive Pan/Zoom) -->
        <div class="workflow-modal-body" id="workflowModalBody">
          <div class="workflow-svg-viewport" id="workflowSvgViewport">
            <div class="workflow-svg-wrapper" id="workflowSvgWrapper">
              <img id="workflowSvgImg" src="" alt="Workflow Diagram" draggable="false" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modular JavaScript Scripts -->
    <script src="/markdown/js/state.js"></script>
    <script src="/markdown/js/telemetry.js"></script>
    <script src="/markdown/js/storage-api.js"></script>
    <script src="/markdown/js/tree.js"></script>
    <script src="/markdown/js/editor-preview.js"></script>
    <script src="/markdown/js/workflow-modal.js"></script>
    <script src="/markdown/js/drawer.js"></script>
    <script src="/markdown/js/dashboard.js"></script>
    <script src="/markdown/js/app.js"></script>
  </body>
</html>
